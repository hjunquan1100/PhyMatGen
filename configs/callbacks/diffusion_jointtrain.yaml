defaults:
  - ema
  - model_checkpoint
  # - early_stopping
  # - learning_rate_monitor
  - _self_

model_checkpoint:
  dirpath: ${paths.output_dir}/checkpoints
  filename: "ldm-epoch@{epoch}-step@{step}-val_valid_rate@{val_valid_rate:.4f}"
  monitor: "val_valid_rate"
  mode: "max"
  save_top_k: 1
  save_last: True
  auto_insert_metric_name: False

